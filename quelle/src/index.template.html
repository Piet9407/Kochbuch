<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kochbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2b2622;--mute:#7a6f66;--line:#e8e0d4;--acc:#d4501e;--acc-ink:#fff;--acc2:#fbe6dc;--ok:#2f8f5b;--warn:#b7791f;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#16120f;--card:#221c18;--ink:#f1ebe3;--mute:#a49a8f;--line:#352d27;--acc:#ff7a45;--acc-ink:#1a0f09;--acc2:#3a231a;--ok:#5cc58b;--warn:#e6b455}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  padding-top:env(safe-area-inset-top);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 16px 10px;margin:0 -16px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.title small{font-size:14px;font-weight:600;color:var(--mute);margin-left:6px;letter-spacing:0}
input[type=search],input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
input:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sel{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
.list{display:grid;gap:12px;margin-top:12px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative}
.card:active{transform:scale(.99)}
.card h3{font-size:17px;font-weight:700;padding-right:34px}
.meta{color:var(--mute);font-size:13px;margin-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--acc2);color:var(--acc)}
.pill.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.n{background:var(--line);color:var(--mute)}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;font-size:21px;line-height:38px;text-align:center;color:var(--mute)}
.heart.on{color:#e0245e}
.empty{text-align:center;color:var(--mute);padding:48px 12px}
/* Tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--acc)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--acc);color:var(--acc-ink);font-size:11px;min-width:18px;height:18px;border-radius:9px;line-height:18px;padding:0 5px}
/* Detail */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--acc);font-weight:600;padding:8px 0}
.dh{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.nut div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.nut b{display:block;font-size:19px}
.nut span{font-size:11.5px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.box h2{font-size:17px;margin-bottom:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{width:40px;height:38px;font-size:22px;color:var(--acc)}
.stepper b{min-width:92px;text-align:center;font-size:15px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{border-top:1px solid var(--line)}
ul.ing li:first-child{border-top:0}
label.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
label.ck input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);margin:1px 0 0;background:var(--card);position:relative}
label.ck input:checked{background:var(--acc);border-color:var(--acc)}
label.ck input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--acc-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
label.ck.done span.t{text-decoration:line-through;color:var(--mute)}
.est{color:var(--warn);font-weight:700;font-size:12px;margin-left:4px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:800;font-size:13px;text-align:center;line-height:26px;margin-top:1px}
.note{font-size:14px;color:var(--mute);margin-top:10px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;text-align:center;margin-top:14px;font-size:16px}
.btn.sec{background:var(--card);color:var(--acc);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;margin:0;font-size:14px;white-space:nowrap}
a{color:var(--acc)}
.sec-h{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 4px 6px}
.qty{color:var(--mute);margin-left:auto;padding-left:10px;white-space:nowrap;font-size:14px}
.small{font-size:13px;color:var(--mute)}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;background:var(--acc2);color:var(--acc);font-weight:600;font-size:14px}
.tag button{color:inherit;font-size:16px;line-height:1;padding:0 4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
.ph{margin:-14px -16px 12px;aspect-ratio:16/10;overflow:hidden;border-radius:16px 16px 0 0;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card.hasimg h3{padding-right:0}
.card.hasimg .heart{background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:50%;top:10px;right:10px;width:36px;height:36px;line-height:36px;font-size:20px}
.hero{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r);margin:10px 0 4px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>

<script>
const RECIPES = /*__DATA__*/[];

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('kb_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('kb_'+k, JSON.stringify(v)); }catch(e){} if(typeof onLocalSet === 'function') onLocalSet(k); }
};
let fav   = new Set(store.get('fav', []));
let cart  = store.get('cart', []);        // [{id, p}]
let done  = store.get('done', {});         // {itemKey: true}
let extra = store.get('extra', []);        // eigene Artikel [{id, t, d}]
const saveExtra = () => store.set('extra', extra);
let pantry= store.get('pantry', []);       // ['hähnchen', ...]
let ui    = Object.assign({q:'', cat:'Alle', sort:'std'}, store.get('ui', {}));
const portionPref = store.get('portions', {});
const byId = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const saveUi = () => store.set('ui', ui);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Mengen formatieren ---------- */
const FR = [[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
function frac(x){
  let w = Math.floor(x + 1e-9), f = x - w, best = FR[0], d = 9;
  for(const o of FR){ const dd = Math.abs(f - o[0]); if(dd < d){ d = dd; best = o; } }
  if(best[0] === 1){ w += 1; best = FR[0]; }
  return (w > 0 ? w : '') + best[1] || '0';
}
const de = n => n.toLocaleString('de-DE', {maximumFractionDigits: 2});
function amount(q, unit){            // q bereits skaliert, unit g|kg|ml|l
  let v = unit === 'kg' ? q * 1000 : unit === 'l' ? q * 1000 : q;
  const base = (unit === 'kg' || unit === 'g') ? 'g' : 'ml';
  if(v >= 1000) return de(v / 1000) + (base === 'g' ? ' kg' : ' l');
  return Math.round(v) + ' ' + base;
}
const UN = {Dosen:'Dose',Dose:'Dose',Prisen:'Prise',Prise:'Prise',Zehen:'Zehe',Zehe:'Zehe',Scheiben:'Scheibe',Stangen:'Stange'};
const UP = {Dose:'Dosen',Prise:'Prisen',Zehe:'Zehen',Scheibe:'Scheiben',Stange:'Stangen'};
const MASS = new Set(['g','kg','ml','l']);
function unitDisp(u, q){ const s = UN[u] || u; return q > 1.01 && UP[s] ? UP[s] : s; }
function scaleName(name, f){
  return name
    .replace(/(\bje )?ca\. ([\d.,]+) (g|kg|Stangen)/g, (m, je, n, u) => {
      if(je) return m; const v = parseFloat(n.replace(',', '.')) * f;
      return 'ca. ' + (u === 'Stangen' ? frac(v) + ' Stangen' : amount(v, u));
    })
    .replace(/oder ([\d.,]+) (g|ml)/g, (m, n, u) => 'oder ' + amount(parseFloat(n.replace(',', '.')) * f, u));
}
function ingText(i, f){
  if(i.qty == null) return esc(i.raw);
  const q = i.qty * f, q2 = i.qty2 != null ? i.qty2 * f : null;
  let amt;
  if(MASS.has(i.unit)){
    amt = amount(q, i.unit);
    if(q2 != null) amt = amt.replace(/ (g|kg|ml|l)$/, '') + '–' + amount(q2, i.unit);
    return esc(amt + ' ' + scaleName(i.name, f));
  }
  const n = q2 != null ? frac(q) + '–' + frac(q2) : frac(q);
  const u = i.unit ? ' ' + (['EL','TL','Bund','Handvoll','Glas','Cup','Packung','Stängel'].includes(i.unit) ? i.unit : unitDisp(i.unit, q2 ?? q)) : '';
  return esc(n + u + ' ' + scaleName(i.name, f));
}

/* ---------- Zutaten normalisieren (Einkaufsliste / Vorrat) ---------- */
const STAPLE = /^(etwas |schuss )?((salz|pfeffer|wasser|(oliven)?öl)\b|ölspray)/i;
const SYN = {eier:'ei', frühlingszwiebeln:'frühlingszwiebel', kartoffeln:'kartoffel', möhren:'möhre', gurken:'gurke', avocados:'avocado',
  bananen:'banane', knoblauchzehe:'knoblauch', knoblauchzehen:'knoblauch', 'weiße zwiebel':'zwiebel', 'große zwiebel':'zwiebel', 'kleine zwiebel':'zwiebel',
  'rote zwiebel':'zwiebel', 'frischer basilikum':'basilikum', 'frühlingszwiebeln zum garnieren':'frühlingszwiebel'};
const DISP = {ei:['Ei','Eier'], frühlingszwiebel:['Frühlingszwiebel','Frühlingszwiebeln'], kartoffel:['Kartoffel','Kartoffeln'], möhre:['Möhre','Möhren'],
  gurke:['Gurke','Gurken'], avocado:['Avocado','Avocados'], banane:['Banane','Bananen'], knoblauch:['Knoblauch','Knoblauch'], zwiebel:['Zwiebel','Zwiebeln']};
function baseName(name){
  let s = name.replace(/\([^)]*\)/g, '').replace(/\s+oder\s+[\d.,]+\s*(g|ml)\b.*$/i, '').split(',')[0].trim();
  s = s.replace(/\s+/g, ' ');
  return s;
}
function keyOf(name){
  let k = baseName(name).toLowerCase();
  if(/^knoblauchzehe/.test(k)) k = 'knoblauch';
  return SYN[k] || k;
}
const isStaple = i => STAPLE.test(baseName(i.name));

const SECTIONS = [
  ['Tiefkühl',            /\bTK\b|kaisergemüse|edamame/i],
  ['Fleisch & Wurst',     /hähnchen|hack|steak|pancetta|salami|schinken|rind/i],
  ['Milch, Käse & Eier',  /\bei\b|eier|käse|sahne|milch|joghurt|quark|skyr|feta|mozzarella|parmesan|butter|grana/i],
  ['Konserven & Saucen',  /dose|tomatenmark|passierte|gehackte tomaten|stückige|pizzatomaten|soße|sauce|ketchup|mayonnaise|honig|essig|gochujang|pesto|brühe|thunfisch|\bmais\b|kidney|sesam|austern/i],
  ['Backen & Würzen',     /pulver|oregano|kreuzkümmel|cumin|backpulver|zimt|vanille|lorbeer|gewürz|zucker|stevia|erythrit|chia|mandel|lebensmittelfarbe|süße|paprika edelsüß|paprika geräuchert/i],
  ['Nudeln, Reis & Brot', /nudel|makkaroni|orzo|kritharaki|tortellini|lasagne|reis\b|spätzle|haferflocken|mehl|stärke|panko|cornflakes|pasta|tortilla|brot\b|vollkornbrot|girandole/i],
  ['Obst & Gemüse',       /tomate|zucchini|paprika|möhre|sellerie|kartoffel|brokkoli|spinat|gurke|avocado|banane|beere|radieschen|zitrone|zwiebel|knoblauch|ingwer|petersilie|koriander|basilikum|salat|kräuter|schnittlauch|kresse/i]
];
const SEC_ORDER = SECTIONS.map(s => s[0]).concat(['Sonstiges']);
const sectionOf = name => { for(const [n, re] of SECTIONS) if(re.test(name)) return n; return 'Sonstiges'; };

/* Einkaufsliste aus Warenkorb */
function buildShopping(){
  const map = new Map();
  for(const c of cart){
    const r = byId[c.id]; if(!r) continue; const f = c.p / 4;
    for(const i of r.ings){
      if(i.opt || isStaple(i)) continue;
      const k = keyOf(i.name); if(!k) continue;
      const sec = sectionOf(k + ' ' + i.name);
      if(i.qty == null){
        const id = sec + '|' + k + '|-';
        if(!map.has(id)) map.set(id, {id, sec, key:k, name:baseName(i.name), unit:'', q:null, from:new Set()});
        map.get(id).from.add(r.title); continue;
      }
      let u = UN[i.unit] || i.unit, q = (i.qty2 ?? i.qty) * f;
      if(u === 'kg'){ u = 'g'; q *= 1000; } else if(u === 'l'){ u = 'ml'; q *= 1000; }
      if(/^knoblauchzehe/i.test(i.name)) u = 'Zehe';
      const id = sec + '|' + k + '|' + u;
      if(!map.has(id)) map.set(id, {id, sec, key:k, name:baseName(i.name), unit:u, q:0, from:new Set()});
      const e = map.get(id); e.q += q; e.from.add(r.title);
    }
  }
  const groups = {};
  for(const e of map.values()) (groups[e.sec] ||= []).push(e);
  for(const g of Object.values(groups)) g.sort((a, b) => a.key.localeCompare(b.key, 'de'));
  return groups;
}
function shopLine(e){
  let name = e.name;
  const d = DISP[e.key];
  if(d) name = (e.q != null && Math.ceil(e.q - 1e-9) > 1) ? d[1] : d[0];
  if(e.q == null) return {name, qty:''};
  let qty;
  if(e.unit === 'g' || e.unit === 'ml') qty = amount(e.q, e.unit);
  else if(['EL', 'TL', 'Cup'].includes(e.unit)) qty = frac(Math.ceil(e.q * 4 - 1e-9) / 4) + ' ' + e.unit;
  else { const n = Math.max(1, Math.ceil(e.q - 1e-9)); qty = !e.unit ? n + '×' : n + ' ' + (['Bund', 'Handvoll', 'Glas', 'Packung', 'Stängel'].includes(e.unit) ? e.unit : unitDisp(e.unit, n)); }
  return {name: name.charAt(0).toUpperCase() + name.slice(1), qty};
}
function shoppingText(){
  const g = buildShopping(); let out = 'Einkaufsliste\n';
  for(const s of SEC_ORDER){ if(!g[s]) continue; out += '\n' + s + '\n';
    for(const e of g[s]){ if(done[e.id]) continue; const l = shopLine(e); out += '• ' + (l.qty ? l.qty + ' ' : '') + l.name + '\n'; } }
  const ex = extra.filter(x => !x.d);
  if(ex.length){ out += '\nEigene Artikel\n' + ex.map(x => '• ' + x.t).join('\n') + '\n'; }
  return out.trim();
}

/* ---------- Vorrat / Resteverwertung ---------- */
/* Begriffsketten: vom Speziellen zum Allgemeinen. Zwei Begriffe passen, wenn der speziellste Begriff des einen in der Kette des anderen steht. */
const CHAINS = [
  [/fr(ü|ue)hlingszwiebel|lauchzwiebel/, ['frühlingszwiebel']],
  [/zwiebelpulver/, ['zwiebelpulver']],
  [/zwiebel/, ['zwiebel']],
  [/knoblauch(?!pulver)/, ['knoblauch']],
  [/tomatenso(ß|ss)e|tomatensauce|passata|passierte|gehackte tomaten|stückige|pizzatomaten|dosentomaten|pizzasauce|pizzasoße|tomatenpüree|sugo|pomodoro/, ['tomatensauce']],
  [/tomatenmark/, ['tomatenmark']],
  [/tomate/, ['tomate']],
  [/saure sahne|schmand|cr(è|e)me fra(î|i)che|sauerrahm/, ['saure sahne']],
  [/kochsahne/, ['kochsahne', 'sahne']],
  [/sahne|cremefine|rahm/, ['sahne']],
  [/hüttenkäse|körniger/, ['hüttenkäse', 'frischkäse']],
  [/frischkäse/, ['frischkäse']],
  [/mozzarella/, ['mozzarella', 'käse']],
  [/parmesan|grana/, ['parmesan', 'käse']],
  [/feta|hirtenkäse/, ['feta', 'käse']],
  [/gouda|ka(ş|s)ar|cheddar|emmentaler|edamer|bergkäse|gruy(è|e)re|tilsiter|maasdam|butterkäse/, ['schnittkäse', 'käse']],
  [/käse|kaese|streukäse|reibekäse/, ['käse']],
  [/hack(?![te])|faschiert|gehacktes/, ['hack']],
  [/hähnchen|hühnchen|huhn\b|hühnerbrust|chicken|geflügel/, ['hähnchen']],
  [/gemüsebrühe|gemüsefond/, ['gemüsebrühe', 'brühe']],
  [/hühnerbrühe|hühnerfond|hühnchenbrühe/, ['hühnerbrühe', 'brühe']],
  [/brühe|bouillon|fond\b/, ['brühe']],
  [/spätzle/, ['spätzle']],
  [/tortellini/, ['tortellini']],
  [/lasagne/, ['lasagne']],
  [/makkaroni/, ['makkaroni', 'nudeln']],
  [/orzo|kritharaki/, ['orzo', 'nudeln']],
  [/nudel|pasta|spaghetti|penne|fusilli|tagliatelle|rigatoni|farfalle|girandole|bandnudeln/, ['nudeln']],
  [/reisessig/, ['reisessig']],
  [/\breis\b|basmati|jasmin/, ['reis']],
  [/kartoffel|erdäpfel/, ['kartoffel']],
  [/paprika(?!pulver|\s*(edelsüß|geräuchert))/, ['paprika']],
  [/skyr/, ['skyr']],
  [/quark/, ['quark']],
  [/joghurt|jogurt/, ['joghurt']],
  [/sojaso(ß|ss)e|sojasauce|soja-sauce|soja sauce/, ['sojasauce']],
  [/\beier?\b/, ['ei']],
  [/mehl/, ['mehl']],
  [/salami/, ['salami']],
  [/pancetta|schinken|speck/, ['schinken']],
  [/karotte|möhre|mohrrübe/, ['möhre']],
  [/kidney/, ['kidneybohnen']],
  [/brokkoli|broccoli/, ['brokkoli']],
  [/spinat/, ['spinat']],
  [/gurke/, ['gurke']],
  [/avocado/, ['avocado']],
  [/banane/, ['banane']],
  [/thunfisch/, ['thunfisch']],
  [/\bmilch\b/, ['milch']],
  [/butter(?!milch)/, ['butter']],
  [/haferflocken/, ['haferflocken']],
  [/zucchini/, ['zucchini']],
];
const chainOf = s => { s = s.toLowerCase(); for(const [re, ch] of CHAINS) if(re.test(s)) return ch; return null; };
function pantryHas(i){
  const k = keyOf(i.name), ci = chainOf(baseName(i.name));
  return pantry.some(t => {
    const ct = chainOf(t);
    if(ci && ct) return ct.includes(ci[0]) || ci.includes(ct[0]);
    return matchTerm(k, t) || matchTerm(i.name.toLowerCase(), t);
  });
}
const matchTerm = (key, t) => t.length >= 2 && (key === t || (t.length >= 3 && (key.includes(t) || (key.length >= 4 && t.includes(key)))));
function pantryScore(r){
  const need = [], have = [], miss = [];
  for(const i of r.ings){
    if(i.opt || isStaple(i)) continue;
    const k = keyOf(i.name), sec = sectionOf(k + ' ' + i.name);
    if(sec === 'Backen & Würzen' && !(MASS.has(i.unit) && i.qty >= 20)) continue;  // Gewürze zählen nicht
    if(i.qty == null && /zum garnieren|basilikum|petersilie|kräuter|lorbeer|salat/i.test(i.name)) continue;
    need.push(i);
    (pantryHas(i) ? have : miss).push(i);
  }
  return {need, have, miss, pct: need.length ? have.length / need.length : 0};
}
function allIngredientNames(){
  const m = new Map();
  for(const r of RECIPES) for(const i of r.ings){ if(i.opt || isStaple(i)) continue; const k = keyOf(i.name); m.set(k, (m.get(k) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
}

    o[k] = s; o['t_' + k] = tl[k] || Date.now();
  }
  Promise.resolve(sync.fs.setDoc(sync.ref, o, {merge: true})).catch(err => { ks.forEach(k => sync.dirty.add(k)); setStatus('error', friendly(err) + ' [' + ((err && err.code) || '') + ']'); });
}
function mergeVal(k, loc, rem){
  if(rem == null) return loc;
  if(k === 'done') return Object.assign({}, loc, outDone(rem));
  if(k === 'fav' || k === 'pantry') return [...new Set([...rem, ...loc])];
  if(k === 'cart'){ const ids = new Set(rem.map(c => c.id)); return rem.concat(loc.filter(c => !ids.has(c.id))); }
  if(k === 'extra'){ const ts = new Set(rem.map(x => x.t.toLowerCase())); return rem.concat(loc.filter(x => !ts.has(x.t.toLowerCase()))); }
  return loc;
}
function onSnap(snap){
  const joined = rawGet('hhjoined') === JSON.stringify(sync.code);
  if(snap.metadata && snap.metadata.fromCache && !joined) return;      // erst auf die Antwort des Servers warten
  const data = snap.exists() ? snap.data() : {};
  let changed = false; sync.applying = true;
  try{
    if(!joined){                                                       // erste Verbindung: beide Seiten zusammenführen
      for(const k of SYNC_KEYS){
        let rem = null; try{ rem = data[k] != null ? JSON.parse(data[k]) : null; }catch(_){}
        rawSet(k, JSON.stringify(mergeVal(k, store.get(k, emptyOf(k)), rem))); reloadVar(k);
        tl[k] = Date.now(); sync.dirty.add(k);
      }
      rawSet('hhjoined', JSON.stringify(sync.code)); changed = true;
    } else {
      for(const k of SYNC_KEYS){
        const rt = data['t_' + k] || 0;
        if(data[k] == null || rt <= (tl[k] || 0)) continue;
        let val; try{ val = JSON.parse(data[k]); }catch(_){ continue; }
        if(k === 'done'){ const keep = Object.fromEntries(Object.entries(store.get('done', {})).filter(([x]) => x.startsWith('i:'))); val = Object.assign({}, val, keep); }
        rawSet(k, JSON.stringify(val)); reloadVar(k); tl[k] = rt; changed = true;
      }
    }
    rawSet('tl', JSON.stringify(tl));
  } finally { sync.applying = false; }
  setStatus('ok', '');
  if(sync.dirty.size) schedulePush();
  if(changed) softRender();
}
function softRender(){
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT')){ sync.late = true; return; }
  const y = scrollY; render(); scrollTo(0, y);
}
document.addEventListener('focusout', () => { if(sync.late){ setTimeout(() => { const a = document.activeElement; if(sync.late && !(a && a.tagName === 'INPUT')){ sync.late = false; softRender(); } }, 250); } });
function friendly(err){
  const c = (err && err.code) || '';
  if(c.includes('permission')) return 'Zugriff verweigert. Prüfe die Firestore-Regeln und dass der Code mindestens 8 Zeichen hat.';
  if(c.includes('not-found') || /does not exist/i.test(err && err.message || '')) return 'Die Datenbank fehlt noch. In Firebase unter „Firestore Database“ eine Datenbank erstellen.';
  if(c.includes('unavailable')) return 'Gerade offline. Änderungen werden später abgeglichen.';
  return 'Fehler: ' + ((err && (err.code || err.message)) || 'unbekannt');
}
function setStatus(s, msg){
  sync.status = s; sync.msg = msg || '';
  const a = document.activeElement;
  if(route() === '/sync' && !(a && a.tagName === 'INPUT')) render();
}
async function syncStart(){
  syncStop();
  if(!sync.code){ setStatus('off'); return; }
  setStatus('connecting');
  try{
    const [app, fs] = await Promise.all([import(FB_BASE + 'firebase-app.js'), import(FB_BASE + 'firebase-firestore.js')]);
    sync.fs = fs;
    const a = app.getApps().length ? app.getApp() : app.initializeApp(FB_CFG);
    let db; try{ db = fs.initializeFirestore(a, {experimentalAutoDetectLongPolling: true, useFetchStreams: false}); }catch(_){ db = fs.getFirestore(a); }
    sync.ref = fs.doc(db, 'haushalte', sync.code);
    sync.unsub = fs.onSnapshot(sync.ref, onSnap, err => setStatus('error', friendly(err) + ' [' + ((err && err.code) || '') + ']'));
  }catch(e){ setStatus('error', 'Firebase konnte nicht geladen werden (' + ((e && e.message) || e) + '). Prüfe die Internetverbindung und starte die App neu.'); }
}
function syncStop(){ if(sync.unsub){ try{ sync.unsub(); }catch(_){} } sync.unsub = null; sync.ref = null; clearTimeout(sync.timer); }
function syncConnect(){
  let v = ($('#hhcode').value || '').trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,'-').replace(/[^a-z0-9_-]/g,'').slice(0,40);
  if(v.length < 8){ sync.status = 'error'; sync.msg = 'Der Code ist zu kurz (mindestens 8 Zeichen). Tippe auf „Code vorschlagen“.'; render(); return; }
  sync.code = v; store.set('hh', v); syncStart();
}
function syncDisconnect(){
  if(!confirm('Synchronisation beenden? Die Daten bleiben auf diesem Gerät.')) return;
  syncStop(); sync.code = ''; store.set('hh', ''); rawSet('hhjoined', '""'); sync.status = 'off'; sync.msg = ''; render();
}
function viewSync(){
  const st = {off:['Nicht verbunden','var(--mute)'], connecting:['Verbinde …','var(--warn)'], ok:['Verbunden ✓','var(--ok)'], error:['Fehler','#d4351c']}[sync.status];
  return `<header class="top"><div class="title">Sync<small>zwischen deinen Geräten</small></div></header>
    <div class="box" style="margin-top:6px"><h2>Haushalts-Code</h2>
      <div class="small" style="margin-bottom:10px">Gib auf allen Geräten denselben Code ein. Dann sind Favoriten, Einkaufsliste, eigene Artikel, Haken und Vorrat überall gleich. Wer den Code kennt, sieht diese Daten. Nimm deshalb keinen leicht erratbaren.</div>
      <input type="text" id="hhcode" value="${esc(sync.code)}" placeholder="z. B. brot-milch-4821" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40">
      <div class="row" style="margin-top:10px;gap:8px"><button class="btn sm sp" style="padding:12px" data-sync-on>${sync.code ? 'Code ändern & verbinden' : 'Verbinden'}</button>
        <button class="btn sm sec" style="padding:12px" data-sync-gen>Code vorschlagen</button></div>
      <div style="margin-top:14px;font-weight:700;color:${st[1]}">${st[0]}</div>
      ${sync.msg ? `<div class="small" style="margin-top:4px;color:${sync.status === 'error' ? '#d4351c' : 'var(--mute)'}">${esc(sync.msg)}</div>` : ''}
      ${sync.code ? `<button class="btn sec" data-sync-off>Synchronisation beenden</button>` : ''}</div>
    <div class="box"><h2>So geht es</h2><div class="note" style="margin:0">1. Hier einen Code wählen und auf <b>Verbinden</b> tippen.<br>2. Auf dem zweiten Gerät denselben Code eingeben.<br>3. Beim ersten Verbinden werden die Daten beider Geräte zusammengeführt.<br>4. Danach erscheinen Änderungen nach wenigen Sekunden auf dem anderen Gerät. Ohne Internet läuft die App weiter und gleicht später ab.<br>Das Abhaken von Zutaten im Rezept bleibt auf dem Gerät.</div></div>`;
}

render();
if(sync.code) syncStart();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
